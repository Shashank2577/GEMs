# TenderPilot — one Worker serves the API (/api/*) and the SPA (static assets), runs the cron
# pipeline, and stores files in R2. Database: Neon Postgres with one `pg` driver (008/FR-075) — through Cloudflare
# Hyperdrive (binding HYPERDRIVE) once enabled below, else the DATABASE_URL secret (Neon pooled `-pooler` URL), which
# is also what `pnpm db:migrate` uses and stays the break-glass fallback.
#
# Secrets (wrangler secret put <NAME>): DATABASE_URL, ANTHROPIC_API_KEY, RESEND_API_KEY,
#   WHATSAPP_TOKEN, WHATSAPP_PHONE_ID, SENTRY_DSN, UNSUBSCRIBE_SECRET (HMAC key for one-click unsubscribe links;
#   required with RESEND_API_KEY, else alert emails carry no List-Unsubscribe header). Optional ones may be
#   omitted (features degrade to no-ops).
# Sentry environment: the Worker always runs with NODE_ENV=production, so a staging deploy must set the var
#   SENTRY_ENVIRONMENT=staging (otherwise its events are tagged "production").
# Deploy: pnpm deploy   (builds apps/web, then `wrangler deploy`)
name = "tenderpilot"
main = "apps/api/src/worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "tenderpilot-blobs"

# 008/FR-075, ADR-0002: Postgres via Hyperdrive. NOT ENABLED YET — the binding needs a real config id, which only an
# operator can create (docs/runbook.md § Hyperdrive → "Enable Hyperdrive"). Until then the Worker connects with the
# DATABASE_URL secret (Neon pooled URL, same `pg` driver), so `wrangler deploy` works as is. To enable, run
#   wrangler hyperdrive create tenderpilot-db --connection-string="$NEON_POOLED_URL" --caching-disabled
# and uncomment the table below with that id (caching must stay disabled: its query cache serves stale reads).
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<id from wrangler hyperdrive create>"
# localConnectionString = "postgres://tp:tp@localhost:5433/tenderpilot"

[triggers]
crons = ["*/30 * * * *"]

[vars]
APP_URL = "https://tenderpilot.workers.dev"
GEM_BASE_URL = "https://bidplus.gem.gov.in"
LLM_MODEL = "claude-sonnet-5-5"
MAIL_FROM = "TenderPilot <alerts@tenderpilot.in>"
# Packet build input cap (008 FR-032 / 006 FR-056): 40 MB keeps pdf-lib's 2-3x peak (ADR-0007) under the 128 MB isolate.
PACKET_MAX_INPUT_BYTES = "41943040"
# Client-IP source for the per-IP auth rate limits (002/FR-010). The Worker default is "cloudflare"
# (cf-connecting-ip, which Cloudflare always overwrites), so this only needs setting to change it
# ("xff" | "none"). Behind another proxy in front of Cloudflare, keep "cloudflare" unless you know why not.
TRUST_PROXY = "cloudflare"

[observability]
enabled = true
